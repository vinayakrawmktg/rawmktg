# netlify.toml
# Files live at /blogs/:slug.html (lowercase folder, .html extension)
# pretty_urls = true makes Netlify serve /blogs/slug → blogs/slug.html natively (no redirect)
# Old /Blogs/ URLs (uppercase) get 301'd to the new clean canonical.

[build]
  publish = "."
  # Regenerate LLM Markdown twins / index.md / llms-full.txt from the HTML on every
  # deploy so they never drift. Non-fatal: if generation fails, the committed .md
  # files are published instead, so a generator hiccup can never break a deploy.
  command = "python3 -m pip install --quiet -r requirements.txt && python3 scripts/generate_llm_md.py || echo 'LLM md generation skipped — publishing committed artifacts'"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Custom 404 page
[build.processing.errors]
  not_found = "/404.html"

# Security + indexing response headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # CSP starts in report-only because the site serves Google AdSense + Chart.js;
    # observe violations in the browser console, then promote to an enforcing
    # Content-Security-Policy header once confirmed nothing (esp. ads) breaks.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://*.googlesyndication.com https://*.googleadservices.com https://*.google.com https://*.doubleclick.net https://*.adtrafficquality.google https://cdnjs.cloudflare.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; frame-src https://googleads.g.doubleclick.net https://*.doubleclick.net https://*.google.com https://*.adtrafficquality.google; connect-src 'self' https://*.google-analytics.com https://*.googlesyndication.com https://*.doubleclick.net https://*.adtrafficquality.google; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

# www → apex (301)
[[redirects]]
  from   = "https://www.rawmktg.com/*"
  to     = "https://rawmktg.com/:splat"
  status = 301
  force  = true

