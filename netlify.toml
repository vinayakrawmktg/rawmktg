# netlify.toml
# Physical files live at /Blogs/:slug.html
# Canonical URLs are /blogs/:slug (clean, lowercase, no extension)
# A 200 rewrite makes Netlify serve the file at the clean URL transparently.
# Old /Blogs/ URLs get 301'd to the new canonical.

[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# www → apex (301)
[[redirects]]
  from   = "https://www.rawmktg.com/*"
  to     = "https://rawmktg.com/:splat"
  status = 301
  force  = true

# Old /posts/ URL already indexed by Google (301)
[[redirects]]
  from   = "/posts/eeat-ai-signal-llm-brand-authority"
  to     = "/blogs/eeat-is-an-ai-signal-now"
  status = 301
  force  = true

# Old uppercase /Blogs/:slug.html → new clean canonical (301)
[[redirects]]
  from   = "/Blogs/:slug.html"
  to     = "/blogs/:slug"
  status = 301
  force  = true

# Old uppercase /Blogs/:slug (no extension) → new clean canonical (301)
[[redirects]]
  from   = "/Blogs/:slug"
  to     = "/blogs/:slug"
  status = 301
  force  = true

# Serve clean /blogs/:slug by transparently proxying /Blogs/:slug.html (200 rewrite)
# Browser URL stays at /blogs/:slug — this is the canonical URL.
[[redirects]]
  from   = "/blogs/:slug"
  to     = "/Blogs/:slug.html"
  status = 200
  force  = true
