# netlify.toml
# Files live at /blogs/:slug.html (lowercase folder, .html extension)
# pretty_urls = true makes Netlify serve /blogs/slug → blogs/slug.html natively (no redirect)
# Old /Blogs/ URLs (uppercase) get 301'd to the new clean canonical.

[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# Custom 404 page
[build.processing.errors]
  not_found = "/404.html"

# X-Robots-Tag for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"

# www → apex (301)
[[redirects]]
  from   = "https://www.rawmktg.com/*"
  to     = "https://rawmktg.com/:splat"
  status = 301
  force  = true

# Old Typeflow /posts/:slug URLs → new /blogs/ canonical (301)
# Full map of all 11 legacy slugs decommissioned in the June 2026 migration.
[[redirects]]
