# ── LLM visibility ─────────────────────────────────────────────
# Markdown twins served with the right content type
[[headers]]
  for = "/blogs/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

# Accept: text/markdown content negotiation (sets Vary + Link, serves .md, 406s)
[[edge_functions]]
  path = "/"
  function = "md-negotiate"

[[edge_functions]]
  path = "/blogs/*"
  function = "md-negotiate"

[[headers]]
  for = "/glossary/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/glossary.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[edge_functions]]
  path = "/glossary"
  function = "md-negotiate"

[[edge_functions]]
  path = "/glossary/*"
  function = "md-negotiate"
