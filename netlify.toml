# netlify.toml
# Files live at /blogs/:slug.html (lowercase folder, .html extension)
# pretty_urls = true makes Netlify serve /blogs/slug → blogs/slug.html natively (no redirect)
# Old /Blogs/ URLs (uppercase) get 301'd to the new clean canonical.

[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

# X-Robots-Tag for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"

# www → apex (301)
[[redirects]]
  from   = "https://www.rawmktg.com/*"
  to     = "https://rawmktg.com/:splat"
  status = 301
  force  = true

# Old /posts/ URL already indexed by Google (301)
[[redirects]]
  from   = "/posts/eeat-ai-signal-llm-brand-authority"
  to     = "/blogs/eeat-is-an-ai-signal-now"
  status = 301
  force  = true

# Old uppercase /Blogs/:slug.html → new clean canonical (301)
[[redirects]]
  from   = "/Blogs/:slug.html"
  to     = "/blogs/:slug"
  status = 301
  force  = true

# Old uppercase /Blogs/:slug (no extension) → new clean canonical (301)
[[redirects]]
  from   = "/Blogs/:slug"
  to     = "/blogs/:slug"
  status = 301
  force  = true
